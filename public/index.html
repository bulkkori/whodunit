<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후더닛</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%95%B5%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b class="logo">🕵️ 후더닛</b>
  <span id="hcode"></span>
  <div id="turnbox" hidden><span id="turnname"></span><div id="bar"><i></i></div><span id="secs"></span></div>
  <button id="mute" class="ghost" aria-label="소리 켜기/끄기">🔊</button>
  <button id="leave" class="ghost" hidden>나가기</button>
</header>

<main>
  <section id="lobby" class="screen card">
    <span class="badge">EARLY ACCESS · 데모</span>
    <h1>🕵️ 후더닛</h1>
    <p class="sub">사건 봉투 속 <b>범인 · 흉기 · 장소</b>를 가장 먼저 밝혀내세요. 3~6명, 빈자리는 봇.</p>
    <p id="wake" class="notice" hidden>☕ 서버를 깨우는 중입니다… (무료 서버라 최대 1분 걸릴 수 있어요)</p>
    <label class="field">닉네임 <input id="name" maxlength="12" placeholder="탐정 이름"></label>
    <div class="opts"><label class="opt"><input type="checkbox" id="c_roles" checked> 🕵️ 탐정 직업 (보너스칸 특수 능력)</label><label class="opt"><input type="checkbox" id="c_bluff" checked> 🎭 블러핑 허용 (내 카드 지목 가능)</label></div>
    <div class="row"><select id="theme"></select><button id="create">방 만들기</button></div>
    <button id="practice" class="ghost">🤖 봇 2명과 바로 연습</button>
    <div class="or">또는</div>
    <div class="row"><input id="code" placeholder="참여 코드" maxlength="5" autocapitalize="characters" autocomplete="off"><button id="join">입장</button></div>
  </section>

  <section id="wait" class="screen card" hidden>
    <p class="sub">참여 코드</p>
    <div id="bigcode"></div>
    <button id="copy" class="ghost">🔗 초대 링크 복사</button>
    <ul id="seats"></ul>
    <p class="sub">내 인물 말 고르기</p>
    <div id="picks"></div>
    <label class="opt"><input type="checkbox" id="optroles"> 🕵️ 탐정 직업 (보너스칸 특수 능력)</label>
    <label class="opt"><input type="checkbox" id="optbluff"> 🎭 블러핑 허용</label>
    <div id="hostctl">
      <select id="theme2"></select>
      <div class="row"><button id="addbot" class="ghost">＋ 봇</button><button id="rmbot" class="ghost">－ 봇</button><button id="start">시작</button></div>
    </div>
    <p id="waitmsg" class="sub"></p>
  </section>

  <section id="game" class="screen" hidden>
    <div id="boardwrap">
      <div id="viewtog" role="group" aria-label="보드 보기"><button data-v="2d">2D</button><button data-v="3d">3D</button><span id="maxmove" hidden></span><button id="reset3d" title="시점 초기화">⟲</button></div>
      <div id="board"></div>
      <div id="board3d" hidden></div>
    </div>
    <aside id="panel">
      <div id="status"></div>
      <div id="last"></div>
      <div id="actions">
        <button data-a="roll" title="꾹 눌렀다 떼면 던집니다 (키보드 R)">🎲 꾹 눌러 던지기</button>
        <button data-a="passage">🕳️ 비밀 통로</button>
        <button data-a="suggest">🔎 추론 <kbd>S</kbd></button>
        <button data-a="end" class="ghost">⏭ 턴 종료</button>
        <button data-a="accuse" class="danger" title="중앙 사건 파일실에서만">⚖️ 최종 고발 (중앙에서)</button>
      </div>
      <div id="rolebox" hidden></div>
      <div id="openrow" hidden><h3>공개 카드 · 진실이 아님</h3><div class="cards"></div></div>
      <h3>내 카드</h3>
      <div id="hand"></div>
    </aside>
  </section>
</main>

<div id="drawer" hidden>
  <button id="handle" aria-label="메모지 열기/닫기">📒 메모 <kbd>N</kbd></button>
  <div class="sheet">
    <div class="sheethead"><b>수사 메모지</b><label><input type="checkbox" id="auto"> 자동 표시</label><button id="closememo" class="ghost" aria-label="메모지 닫기">✕</button></div>
    <p class="hint">칸: 빈칸 → ✗ → ✓ → ? · 이름 누르면 줄 긋기</p>
    <div class="memowrap"><table id="memo"></table></div>
    <input id="note" maxlength="200" placeholder="자유 메모">
    <details id="logbox"><summary>지난 추론 기록</summary><ol id="log"></ol></details>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toast"></div>
<div id="reveal" hidden></div>
<div id="hovertip" hidden></div>
<script type="module" src="/build/client.js"></script>
</body>
</html>
